# =============================================================================
#  /etc/tarea32/backup.conf - Plantilla de configuracion de backup.sh
#  Este archivo se carga con "source": usa sintaxis de Bash.
# =============================================================================

# Que se respalda
ORIGENES=(/srv/empresa /home /etc)

# Patrones que NO se respaldan
EXCLUIR=('*/.cache' '*/.local/share/Trash' '*/snap' '*.iso' '*/lost+found')

# Medio secundario (debe existir en /etc/fstab; se monta solo al respaldar)
PUNTO_MONTAJE="/mnt/respaldos"
MONTAR_AUTOMATICO="si"
DESMONTAR_AL_FINAL="si"
SUBCARPETA="tarea32"

# Politica: completo semanal + diferencial diario
DIA_COMPLETO=7                # 1=lunes ... 7=domingo (solo modo "auto")
TIPO_DIARIO="diferencial"     # diferencial | incremental
RETENER_COMPLETOS=4           # 4 ciclos semanales = ~1 mes de historial

# Seguridad
ESPACIO_MINIMO_MB=200

# Copia a servidor remoto (opcional). Requiere llave SSH sin contrasena para root.
# Ejemplo: REMOTO="respaldo@192.168.56.10:/srv/respaldos"
REMOTO=""

# Archivos de control
LOG="/var/log/tarea32_backup.log"
SNAR_DIR="/var/lib/tarea32"
