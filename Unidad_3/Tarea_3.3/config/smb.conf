# =============================================================================
#  /etc/samba/smb.conf - Recursos compartidos del RAID (Tarea 3.3)
#  Valida la sintaxis con:  testparm -s
# =============================================================================
[global]
   workgroup = WORKGROUP
   server string = Servidor de archivos Xubuntu (RAID 5)
   netbios name = XUBUNTU-SRV
   server role = standalone server

   # Seguridad: solo usuarios con contrasena de Samba, nada de invitados
   security = user
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2_10
   smb encrypt = desired

   # Escuchar solo en la red interna (solo anfitrion) y en localhost
   interfaces = lo 192.168.56.0/24
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.56.
   hosts deny = ALL

   # Bitacora por equipo cliente
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # Sin impresoras por Samba: la impresion se comparte por IPP (CUPS)
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

# ---- Carpeta para todos los empleados ----
[general]
   comment = Carpeta general de la empresa
   path = /srv/raid/compartido/general
   valid users = @empleados
   read only = no
   force group = empleados
   create mask = 0640
   directory mask = 2750

# ---- Carpetas por departamento: solo su personal ----
[sistemas]
   comment = Departamento de Sistemas
   path = /srv/raid/compartido/sistemas
   valid users = @sistemas
   read only = no
   force group = sistemas
   create mask = 0660
   directory mask = 2770

[finanzas]
   comment = Departamento de Finanzas
   path = /srv/raid/compartido/finanzas
   valid users = @finanzas
   read only = no
   force group = finanzas
   create mask = 0660
   directory mask = 2770

[operaciones]
   comment = Departamento de Operaciones
   path = /srv/raid/compartido/operaciones
   valid users = @operaciones
   read only = no
   force group = operaciones
   create mask = 0660
   directory mask = 2770
